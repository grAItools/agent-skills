name: Trigger eval

# Deliberately not a pull request gate. The eval asks a model which skills a
# prompt would load, so it costs money per run, varies between runs, and needs a
# secret that pull requests from forks cannot read. Gating on it would trade a
# deterministic red tick for a flaky one. Run it when a description changes.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to route with
        default: claude-opus-5
      effort:
        description: Reasoning effort
        type: choice
        options: [low, medium, high, xhigh, max]
        default: medium
      threshold:
        description: Minimum routing and disjointness rate (0-1)
        default: "0.9"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the SDK
        run: pip install "anthropic==0.121.0" "PyYAML==6.0.2"

      # Inputs travel through `env`, not through `${{ }}` inside `run`. Actions
      # substitutes those expressions before the shell sees the script, so a
      # dispatcher could put shell syntax in `model` or `threshold` — both are
      # free text — and have it run as code in a step holding the API key. As an
      # environment variable the same value is only ever data.
      - name: Route the corpus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          python3 scripts/run_trigger_eval.py \
            --model "$MODEL" \
            --effort "$EFFORT" \
            --threshold "$THRESHOLD"
