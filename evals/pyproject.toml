[project]
name = "graitools-evals"
version = "0.1.0"
description = "Behavioral evaluation harness for the graitools agent skills"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.scripts]
evals = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
